<svg xmlns="http://www.w3.org/2000/svg" viewBox="325 20 460 460" role="img" aria-label="FridayRadar">
  <defs>
    <path id="ball" d="M-70 0 C-38 -40 38 -40 70 0 C38 40 -38 40 -70 0 Z" />

    <radialGradient id="bezelGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#eef1f7" />
      <stop offset="45%" stop-color="#9aa7b8" />
      <stop offset="100%" stop-color="#3d4653" />
    </radialGradient>

    <radialGradient id="screenGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1c2a17" />
      <stop offset="100%" stop-color="#050a12" />
    </radialGradient>

    <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd873" />
      <stop offset="100%" stop-color="#c8790f" />
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffd873" stop-opacity="0.55" />
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="dropShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <clipPath id="screenClip"><circle cx="555" cy="250" r="168" /></clipPath>
  </defs>

  <ellipse cx="555" cy="250" rx="230" ry="220" fill="#0d1526" opacity="0.6" filter="url(#softBlur)" />

  <circle cx="555" cy="250" r="184" fill="url(#bezelGrad)" />
  <circle cx="555" cy="250" r="168" fill="url(#screenGlow)" />

  <g clip-path="url(#screenClip)">
    <g stroke="#fbbf24" stroke-width="1.4" opacity="0.4" fill="none">
      <circle cx="555" cy="250" r="135" />
      <circle cx="555" cy="250" r="100" />
      <circle cx="555" cy="250" r="65" />
      <circle cx="555" cy="250" r="30" />
    </g>
    <g stroke="#fbbf24" stroke-width="1.2" opacity="0.3">
      <line x1="555" y1="82" x2="555" y2="418" />
      <line x1="387" y1="250" x2="723" y2="250" />
    </g>
    <path d="M555 250 L555 82 A168 168 0 0 1 715 190 Z" fill="url(#sweepGrad)" />
    <circle cx="470" cy="185" r="5" fill="#ffd873" />
    <circle cx="640" cy="310" r="4" fill="#ffd873" opacity="0.8" />
    <circle cx="500" cy="330" r="3.5" fill="#ffd873" opacity="0.7" />
    <text x="555" y="400" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#fbbf24" opacity="0.75" letter-spacing="2">50</text>
  </g>
  <circle cx="555" cy="250" r="168" fill="none" stroke="#2b3340" stroke-width="3" opacity="0.6" />

  <g opacity="0.55">
    <ellipse cx="555" cy="300" rx="16" ry="5" fill="none" stroke="#fbbf24" stroke-width="1.6" />
    <ellipse cx="555" cy="300" rx="28" ry="8.5" fill="none" stroke="#fbbf24" stroke-width="1.3" opacity="0.6" />
  </g>
  <path d="M521 200 A34 34 0 1 1 589 200 C589 224 567 244 555 272 C543 244 521 224 521 200 Z"
        fill="url(#pinGrad)" stroke="#3a2b06" stroke-width="3" filter="url(#dropShadow)" />
  <g transform="translate(555 202) rotate(-18) scale(0.3)">
    <use href="#ball" fill="#0a101c" />
    <g stroke="#ffd873" stroke-width="4.5" stroke-linecap="round">
      <line x1="-42" y1="0" x2="30" y2="0" />
      <line x1="-30" y1="-9" x2="-30" y2="9" />
      <line x1="-16" y1="-11" x2="-16" y2="11" />
      <line x1="-2" y1="-12" x2="-2" y2="12" />
      <line x1="12" y1="-11" x2="12" y2="11" />
    </g>
  </g>
</svg>
